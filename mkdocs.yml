site_name: CSIT5730 复习笔记
site_description: HKUST CSIT5730 Principles of Cybersecurity 复习资料
site_author: dionysus23334
site_url: https://dionysus23334.github.io/CSIT-5730-WebCybersecurity/
repo_url: https://github.com/dionysus23334/CSIT-5730-WebCybersecurity
repo_name: dionysus23334/CSIT-5730-WebCybersecurity
edit_uri: edit/main/docs/
copyright: 个人复习整理 · 非官方资料 · 课件版权归授课教师所有

theme:
  name: material
  language: zh
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - ← 个人主页: https://dionysus23334.github.io/study-blogs/
  - 首页: index.md
  - 知识大纲: outline.md
  - 术语表: glossary.md
  - 分章复习:
      - 总目录: review/index.md
      - 第 1 章 · 导论与古典密码: review/ch1-intro.md
      - 第 2 章 · 对称密码: review/ch2-symmetric.md
      - 第 3 章 · 公钥密码: review/ch3-public-key.md
      - 第 4 章 · 恶意软件与逆向工程: review/ch4-malware-re.md
      - 第 5 章 · 缓冲区溢出与混淆: review/ch5-buffer-obfuscation.md
      - 第 6 章 · 软件利用 II 与侧信道: review/ch6-exploit-sidechannel.md
      - 第 7 章 · 认证与网络安全: review/ch7-auth-network.md
  - 作业解析:
      - 总览: hw/index.md
      - 作业一复盘 · 密码学基础: hw/hw1.md
      - 作业二复盘 · 逆向与内存安全: hw/hw2.md

plugins:
  - search:
      lang:
        - zh
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
          site_name: CSIT5730 复习笔记
          site_description: HKUST CSIT5730 Principles of Cybersecurity 复习资料
        - locale: en
          name: English
          build: true
          site_name: CSIT5730 Review Notes
          site_description: HKUST CSIT5730 Principles of Cybersecurity — review notes
          site_url: https://dionysus23334.github.io/CSIT-5730-WebCybersecurity/en/
          copyright: Personal study notes · Unofficial · Course materials remain the property of the instructor.
          theme:
            language: en
          nav_translations:
            '← 个人主页': '← Study archive'
            '首页': 'Home'
            '知识大纲': 'Outline'
            '术语表': 'Glossary'
            '分章复习': 'Chapters'
            '总目录': 'All chapters'
            '第 1 章 · 导论与古典密码': 'Chapter 1 · Introduction & Classical Cryptography'
            '第 2 章 · 对称密码': 'Chapter 2 · Symmetric Key Cryptography'
            '第 3 章 · 公钥密码': 'Chapter 3 · Public Key Cryptography'
            '第 4 章 · 恶意软件与逆向工程': 'Chapter 4 · Malware & Reverse Engineering'
            '第 5 章 · 缓冲区溢出与混淆': 'Chapter 5 · Buffer Overflow & Obfuscation'
            '第 6 章 · 软件利用 II 与侧信道': 'Chapter 6 · Software Exploitation II & Side Channels'
            '第 7 章 · 认证与网络安全': 'Chapter 7 · Authentication & Network Security'
            '作业解析': 'Homework'
            '总览': 'Overview'
            '作业一复盘 · 密码学基础': 'Homework 1 · Cryptography Foundations'
            '作业二复盘 · 逆向与内存安全': 'Homework 2 · Reverse Engineering & Memory Safety'

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      linenums: true
      linenums_style: inline
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [square]
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  .DS_Store

validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/table-wrap.js
  - javascripts/lang-switch.js
  - javascripts/glossary.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  alternate:
    - name: 中文
      link: https://dionysus23334.github.io/CSIT-5730-WebCybersecurity/
      lang: zh
    - name: English
      link: https://dionysus23334.github.io/CSIT-5730-WebCybersecurity/en/
      lang: en
